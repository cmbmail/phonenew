server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: phonecost

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

  # DataSource — MUST be set via environment variables in production
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:phonecost}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${DB_USER:phonecost_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 100
        jdbc.batch_size: 500
        order_inserts: true
        order_updates: true

  # Jackson (SNAKE_CASE for API consistency)
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # Cache
  cache:
    type: redis
    redis:
      time-to-live: 600s

  # File upload
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

# JWT — MUST be set via environment variables in production
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 7200000   # 2 hours
  refresh-token-expiration: 604800000 # 7 days

# App upgrade paths
app:
  upgrade:
    frontend-dist-dir: ${APP_FRONTEND_DIR:/data/apps/phonecost/frontend}
    package-dir: ${APP_UPGRADE_DIR:/data/apps/phonecost/upgrade_packages}
    staging-dir: ${APP_STAGING_DIR:/data/apps/phonecost/upgrade_staging}
    backend-jar-dir: ${APP_BACKEND_DIR:/data/apps/phonecost/backend}
    backend-jar-direct: ${APP_BACKEND_JAR:/data/apps/phonecost/backend/phonecost.jar}
    backend-jar-target: ${APP_BACKEND_TARGET:/data/apps/phonecost/backend/phonecost/target/phonecost-0.1.0-SNAPSHOT.jar}

# CORS — MUST be set via environment variable in production
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}

# Logging
logging:
  level:
    root: INFO
    com.phonecost: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  file:
    name: /data/apps/phonecost/logs/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
